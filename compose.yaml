name: direkt-calltrainer
services:
  app:
    image: direkt-calltrainer
    build:
      context: .
      dockerfile: ./Dockerfile
    env_file:
      - .env
    environment:
      # Within the compose network the database host is "db", not localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    ports:
      - 8000:8000
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        # Backend code changes: synced into the running container and the
        # gunicorn process restarted, without a full image rebuild.
        - action: sync+restart
          path: ./backend
          target: /app/backend
        # Anything that needs `pip install` or the frontend build re-run:
        # cheap enough to just rebuild the image from scratch.
        - action: rebuild
          path: ./requirements.txt
        - action: rebuild
          path: ./frontend
          ignore:
            - node_modules/
            - dist/

  # The Feedback worker (ADR 0018/0019): same image and code as the app, a
  # different process. It only ever touches Postgres and the LLM gateway, so
  # it needs no port of its own and nothing depends on it being up for a call
  # to run -- a stopped worker just means wrap-ups queue until it returns.
  worker:
    image: direkt-calltrainer
    build:
      context: .
      dockerfile: ./Dockerfile
    command: ["python", "-m", "backend.worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /app/backend
        - action: rebuild
          path: ./requirements.txt

  redis:
    image: redis:8-alpine
    # No volume: the queue holds in-flight jobs only. What must survive a
    # restart is the job's outcome, and that lives in Postgres (ADR 0032).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
