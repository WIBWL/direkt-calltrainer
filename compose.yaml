services:
  pjscalltrainer:
    image: pjscalltrainer
    build:
      context: .
      dockerfile: ./Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://calltrainer:calltrainer@postgres:5432/calltrainer
    ports:
      - 8000:8000
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: calltrainer
      POSTGRES_PASSWORD: calltrainer
      POSTGRES_DB: calltrainer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5432:5432

volumes:
  postgres_data:
