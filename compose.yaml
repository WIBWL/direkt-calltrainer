name: direkt-calltrainer
services:
  app:
    image: direkt-calltrainer
    # Nothing here comes back on its own otherwise: a Docker restart, an OOM
    # kill or a crash leaves the container down. On the worker that is silent
    # -- calls keep working and wrap-ups simply never appear -- which is
    # exactly how a dead worker went unnoticed for hours.
    restart: unless-stopped
    # Pinned: praat-parselmouth ships no Linux aarch64 wheel, so an arm64 build
    # falls back to the source tarball and fails to compile in python-slim.
    platform: linux/amd64
    build:
      context: .
      dockerfile: ./Dockerfile
      platforms:
        - linux/amd64
      args:
        # The SPA needs the issuer at `npm run build` time (see Dockerfile).
        # Same name the backend reads below, from the same .env line.
        OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:18081/realms/direkt}
    env_file:
      - .env
    environment:
      # The only part of the connection that differs from the host default:
      # within the compose network the database is reachable as "db". User,
      # password and database name come from the env_file, and the URL itself
      # is assembled in backend/db/session.py.
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379
      # The token `iss` and the browser's authority — reachable at localhost:18081
      # from the host. The container can't reach that, so it fetches the keys
      # over the compose network instead (backend/auth.py's OIDC_JWKS_URL).
      OIDC_ISSUER: http://localhost:18081/realms/direkt
      OIDC_JWKS_URL: http://keycloak:8080/realms/direkt/protocol/openid-connect/certs
    ports:
      # Host port is deliberately non-standard to avoid clashes (e.g. mkdocs,
      # other uvicorn/Django apps, all default to 8000). Container stays 8000.
      - 8391:8000
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      # Readiness, not liveness: an instance that cannot reach the database can
      # only answer 503, so it should not count as healthy. Uses Python because
      # the image has no curl. start_period covers migrations and seeding, which
      # run in the app's own lifespan handler (backend/db/provision.py).
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready').read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    develop:
      watch:
        # Backend code changes: synced into the running container and the
        # gunicorn process restarted, without a full image rebuild.
        - action: sync+restart
          path: ./backend
          target: /app/backend
        # Anything that needs `pip install` or the frontend build re-run:
        # cheap enough to just rebuild the image from scratch.
        - action: rebuild
          path: ./requirements.txt
        - action: rebuild
          path: ./frontend
          ignore:
            - node_modules/
            - dist/

  # The Feedback worker (ADR 0018/0019): same image and code as the app, a
  # different process. It only ever touches Postgres and the LLM gateway, so
  # it needs no port of its own and nothing depends on it being up for a call
  # to run -- a stopped worker just means wrap-ups queue until it returns.
  worker:
    image: direkt-calltrainer
    # Nothing here comes back on its own otherwise: a Docker restart, an OOM
    # kill or a crash leaves the container down. On the worker that is silent
    # -- calls keep working and wrap-ups simply never appear -- which is
    # exactly how a dead worker went unnoticed for hours.
    restart: unless-stopped
    # Same image as app, so the same pin applies.
    platform: linux/amd64
    build:
      context: .
      dockerfile: ./Dockerfile
      platforms:
        - linux/amd64
    command: ["python", "-m", "backend.worker"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /app/backend
        - action: rebuild
          path: ./requirements.txt

  redis:
    # Not streamed by `docker compose up` -- `docker compose logs redis`
    # still has every line. It says nothing a running system needs; the queue
    # is observed through the worker, which stays attached.
    attach: false
    image: redis:8-alpine
    # `warning` silences the module-load and "ready to accept connections"
    # notices at boot; nothing here needs Redis's own info logs.
    command: ["redis-server", "--loglevel", "warning"]
    # Nothing here comes back on its own otherwise: a Docker restart, an OOM
    # kill or a crash leaves the container down. On the worker that is silent
    # -- calls keep working and wrap-ups simply never appear -- which is
    # exactly how a dead worker went unnoticed for hours.
    restart: unless-stopped
    # No volume: the queue holds in-flight jobs only. What must survive a
    # restart is the job's outcome, and that lives in Postgres (ADR 0032).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: postgres:17
    # Not streamed by `docker compose up` (`docker compose logs db` has it all):
    # test runs produce hundreds of checkpoint lines. `attach: false` rather than
    # a log level, because `log_min_messages` ranks LOG above ERROR, so raising it
    # past the chatter silences real errors too (verified).
    attach: false
    # Checkpoint logging off on top of that, so a test run does not fill the
    # captured log either. Turn it back on before diagnosing real I/O.
    command: postgres -c log_checkpoints=off
    # Nothing here comes back on its own otherwise: a Docker restart, an OOM
    # kill or a crash leaves the container down. On the worker that is silent
    # -- calls keep working and wrap-ups simply never appear -- which is
    # exactly how a dead worker went unnoticed for hours.
    restart: unless-stopped
    environment:
      # Fixed, matching DEFAULT_USER/DEFAULT_DATABASE in backend/db/session.py.
      # Applied only when the volume is created, so existing volumes carry
      # "trainer" -- do not switch to the image's default "postgres".
      POSTGRES_USER: trainer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: trainer
    ports:
      # Loopback only, for host-side work (psql, pytest); app and worker reach
      # the database as `db`. A bare "5432:5432" would bind every interface
      # (ADR 0020).
      - 127.0.0.1:5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainer -d trainer"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local identity provider (ADR 0009), realm from keycloak/direkt-realm.json.
  # Import is SKIPPED if the realm exists: after editing the JSON,
  # `docker compose down -v && docker compose up`.
  # KC_HOSTNAME pins the issuer to localhost:18081; --hostname-strict=false lets
  # the app reach it as `keycloak:8080` for the JWKS.
  keycloak:
    # Not streamed by `docker compose up` (startup noise only);
    # `docker compose logs keycloak` still has every line.
    attach: false
    image: quay.io/keycloak/keycloak:26.7
    # Nothing here comes back on its own otherwise: a Docker restart, an OOM
    # kill or a crash leaves the container down. On the worker that is silent
    # -- calls keep working and wrap-ups simply never appear -- which is
    # exactly how a dead worker went unnoticed for hours.
    restart: unless-stopped
    command: start-dev --import-realm --hostname-strict=false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:18081
      KC_HEALTH_ENABLED: "true"
      # Quarkus/Infinispan/Hibernate boot chatter drowns everything else in the
      # compose logs; WARN keeps the "started in Ns" line and errors.
      KC_LOG_LEVEL: WARN
    ports:
      # Loopback only: the admin console is reachable with admin/admin.
      # Both loopback addresses are needed: Windows resolves `localhost` to ::1
      # first, and an IPv4-only binding costs ~200 ms per request on the
      # fallback to 127.0.0.1.
      - 127.0.0.1:18081:8080
      - "[::1]:18081:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # KC 26 images carry no curl/wget; bash's /dev/tcp checks the HTTP port is
      # accepting connections. Realm import finishes within `start_period`.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

volumes:
  # Named explicitly so `docker volume rm` can address it without guessing at
  # Compose's project prefix. The value is the name Compose already generates,
  # underscore included -- picking the prettier `direkt-calltrainer-pgdata`
  # would point the database at a new, empty volume and appear to lose every
  # stored Session.
  pgdata:
    name: direkt-calltrainer_pgdata
  keycloak-data:
    name: direkt-calltrainer-keycloak-data
