<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calltrainer — Audio-Übersetzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Schibsted+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #03253e;
      --navy-light: #325f7f;
      --blue: #5f8caa;
      --blue-light: #8cb6df;
      --bg: #f5f8fb;
      --border: #e3eaf1;
      --text-muted: #5b6b78;
      --success: #2e8064;
      --danger: #b4453a;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Hanken Grotesk', sans-serif;
      background: var(--bg);
      color: var(--navy);
      max-width: 40rem;
      margin: 3rem auto;
      padding: 0 1.5rem;
    }

    .eyebrow {
      font-family: 'IBM Plex Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 0.7rem;
      color: var(--blue);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: 'Schibsted Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.75rem;
      letter-spacing: -0.02em;
      margin: 0 0 1.5rem;
    }

    h2 {
      font-family: 'Schibsted Grotesk', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--navy-light);
      margin: 0 0 0.35rem;
    }

    label.upload {
      display: block;
      border: 2px dashed var(--border);
      border-radius: 20px;
      padding: 2.5rem 1.5rem;
      text-align: center;
      cursor: pointer;
      color: var(--text-muted);
      background: #fff;
      transition: border-color 0.2s, color 0.2s;
    }

    label.upload:hover {
      border-color: var(--blue-light);
      color: var(--navy-light);
    }

    input[type="file"] { display: none; }

    #status {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.02em;
      color: var(--text-muted);
      margin-top: 1rem;
      min-height: 1.2em;
    }

    #status.error { color: var(--danger); }
    #status.success { color: var(--success); }

    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.5rem;
      margin-top: 1.5rem;
    }

    .card + .card { margin-top: 1rem; }

    p { margin: 0; line-height: 1.5; }

    audio {
      width: 100%;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="eyebrow">Calltrainer</div>
  <h1>Audiodatei hochladen</h1>

  <label class="upload" for="file">
    <span id="drop-label">🎙️ Audiodatei auswählen</span>
    <input type="file" id="file" accept="audio/*">
  </label>

  <p id="status"></p>

  <div id="result" hidden>
    <div class="card">
      <h2>Transkript</h2>
      <p id="transcript"></p>
    </div>
    <div class="card">
      <h2>Übersetzung (Englisch)</h2>
      <p id="translation"></p>
    </div>
    <div class="card">
      <h2>Sprachausgabe</h2>
      <audio id="audio" controls></audio>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById("file");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const dropLabel = document.getElementById("drop-label");

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      if (!file) return;

      dropLabel.textContent = file.name;
      resultEl.hidden = true;
      statusEl.className = "";
      statusEl.textContent = "Verarbeite Audiodatei …";

      const formData = new FormData();
      formData.append("file", file);

      try {
        const response = await fetch("/api/process", { method: "POST", body: formData });
        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.detail || response.statusText);
        }
        const data = await response.json();

        document.getElementById("transcript").textContent = data.transcript;
        document.getElementById("translation").textContent = data.translation;
        document.getElementById("audio").src = "data:audio/mpeg;base64," + data.audio_base64;

        statusEl.className = "success";
        statusEl.textContent = "Fertig.";
        resultEl.hidden = false;
      } catch (e) {
        statusEl.className = "error";
        statusEl.textContent = "Fehler: " + e.message;
      }
    });
  </script>
</body>
</html>
