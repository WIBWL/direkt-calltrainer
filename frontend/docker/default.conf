server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  access_log off;

  # mime.types has no `.mjs`; without it the VAD's glue is refused and no call takes turns.
  # A `types` block replaces the inherited map, hence the include first.
  include /etc/nginx/mime.types;
  types {
    application/javascript mjs;
  }

  gzip on;
  gzip_types text/css application/javascript text/javascript application/json
             image/svg+xml application/wasm;

  # Written by render-config.sh. Repeated in every location with an add_header of its
  # own, which drops the server's.
  include /etc/nginx/security-headers.conf;

  # SPA fallback for client routes.
  location / {
    try_files $uri /index.html;
  }

  # A missing file stays a 404 rather than index.html.
  location ~ \.[^/]*$ {
    try_files $uri =404;
  }

  location = /config.js {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store";
  }
}
