server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  access_log off;

  # nginx's mime.types knows no `.mjs`, and a module script served as
  # application/octet-stream is refused outright -- the VAD's onnxruntime glue
  # (/vad/*.mjs) failed to load, and with it the call's turn-taking. A `types`
  # block here replaces the inherited map, hence the include before it.
  include /etc/nginx/mime.types;
  types {
    application/javascript mjs;
  }

  gzip on;
  gzip_types text/css application/javascript text/javascript application/json
             image/svg+xml application/wasm;

  # The Content-Security-Policy and friends, written at start by
  # render-config.sh (the CSP names the API and Keycloak hosts). Repeated in
  # every location below that sets a header of its own, since nginx drops the
  # server's add_header in a location that has any.
  include /etc/nginx/security-headers.conf;

  # SPA fallback: a reload or shared link to a client route such as /profil
  # gets the app (incl. the OIDC callback).
  location / {
    try_files $uri /index.html;
  }

  # A missing path whose last segment has a dot asked for a file and stays a
  # 404 -- "/assets/main.js" must not come back as index.html.
  location ~ \.[^/]*$ {
    try_files $uri =404;
  }

  # Runtime config, regenerated per deployment; never cache it.
  location = /config.js {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store";
  }
}
