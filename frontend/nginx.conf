# Local development: serves the built SPA and forwards everything the backend
# owns, so the browser talks to one origin. In deployment static.nginx.conf runs
# instead and the external reverse proxy does the forwarding.
user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker's resolver, re-asked every 10 s: a recreated backend container
    # gets a new address, and nginx would otherwise keep the one from its start.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 80;

        # The API, the live session's WebSocket and the health checks. An
        # unknown path under these must answer from the backend, never with the
        # SPA's HTML. Regex locations win over spa.conf's prefix location.
        location ~ ^/(api|ws|health) {
            set $backend http://backend:8000;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # A call's socket can sit quiet while the User thinks; nginx's
            # 60 s default would cut it off.
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
            # Document upload.
            client_max_body_size 20m;
        }

        include /etc/nginx/conf.d/spa.conf;
    }
}
