[alembic]
script_location = %(here)s/migrations
# The repository root, where `shared` is imported from.
prepend_sys_path = %(here)s/../..
version_path_separator = os  # Use os.pathsep. Default configuration used for new projects.
# No URL here: env.py builds it as the app does (ADR 0027).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
