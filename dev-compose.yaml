# Backing services for local development; must match .env.example. Loopback only:
# the credentials are in git.
name: direkt-calltrainer

services:
  postgres:
    image: postgres:17
    # A database per test would fill the log with checkpoints.
    command: postgres -c log_checkpoints=off
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: calltrainer
    ports:
      - '127.0.0.1:15433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d calltrainer']
      interval: 5s
      timeout: 5s
      retries: 10

  # No volume: a job's outcome lives in Postgres (ADR 0032).
  redis:
    image: redis:8-alpine
    command: ['redis-server', '--loglevel', 'warning']
    ports:
      - '127.0.0.1:16379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Imports keycloak/direkt-realm.json only into an empty volume (see README).
  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_LOG_LEVEL: WARN
    ports:
      # Both: Windows tries ::1 first, and the IPv4 fallback costs ~200 ms per request.
      - '127.0.0.1:18081:8080'
      - '[::1]:18081:8080'
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro

volumes:
  postgres-data:
    name: direkt-calltrainer-postgres-data
  keycloak-data:
    name: direkt-calltrainer-keycloak-data
