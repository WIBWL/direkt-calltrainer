# Deployment: a standalone file, not an override of compose.yaml. The server
# needs this file and a .env beside it, no checkout of the repository:
#   docker login registry.internal.efre-direkt.de
#   docker compose -f compose.prod.yaml pull
#   docker compose -f compose.prod.yaml up -d
# The images come from the registry (docker-bake.hcl builds and pushes them);
# TAG picks the version, default `latest`. Every setting reaches the containers
# through `environment` below, interpolated from .env -- `:?` makes `up` fail
# on a missing one rather than start a container that dies on import.
# Nothing publishes a port. TLS and routing belong to the external reverse
# proxy, which reaches the frontend and the backend over the shared Docker
# network PROXY_NETWORK. Steps: docs/deployment.md.

name: direkt-calltrainer

x-logging: &logging
  # Docker's own json-file log grows without limit unless told otherwise.
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  frontend:
    image: registry.internal.efre-direkt.de/direkt-calltrainer-frontend:${TAG:-latest}
    restart: unless-stopped
    # Static files only: the external proxy sends /api, /ws and /health to the
    # backend itself (frontend/static.nginx.conf).
    command: ["nginx", "-c", "/etc/nginx/static.nginx.conf", "-g", "daemon off;"]
    environment:
      # Served to the SPA at runtime as /config.js; the same realm the backend
      # checks tokens against.
      OIDC_ISSUER: ${OIDC_ISSUER:?set OIDC_ISSUER in .env}
    healthcheck:
      # 127.0.0.1, not localhost: nginx listens on IPv4 only.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
    # The proxy's network is shared with other stacks, where a bare `frontend`
    # could resolve to someone else's container; the proxy uses the alias.
    networks:
      default:
      proxy:
        aliases: [calltrainer-frontend]
    logging: *logging

  backend:
    image: registry.internal.efre-direkt.de/direkt-calltrainer-backend:${TAG:-latest}
    restart: unless-stopped
    environment: &backend-environment
      DIREKT_URL: ${DIREKT_URL:?set DIREKT_URL in .env}
      DIREKT_API_KEY: ${DIREKT_API_KEY:?set DIREKT_API_KEY in .env}
      KUGELAUDIO_API_KEY: ${KUGELAUDIO_API_KEY:?set KUGELAUDIO_API_KEY in .env}
      STT_MODEL: ${STT_MODEL:?set STT_MODEL in .env}
      LLM_MODEL: ${LLM_MODEL:?set LLM_MODEL in .env}
      KUGELAUDIO_MODEL: ${KUGELAUDIO_MODEL:?set KUGELAUDIO_MODEL in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Role and database default to `trainer` in backend/db/session.py, the
      # names the db service below creates.
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379
      # The keys are found through the issuer's own discovery document, so no
      # OIDC_JWKS_URL: the container reaches the deployed realm directly.
      OIDC_ISSUER: ${OIDC_ISSUER:?set OIDC_ISSUER in .env}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Readiness: an instance that cannot reach the database answers 503.
      # start_period covers migrations and seeding (backend/db/provision.py).
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready').read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      default:
      proxy:
        aliases: [calltrainer-backend]
    logging: *logging

  # The Feedback worker (ADR 0018/0019). If it is down, calls still run and
  # wrap-ups silently queue -- `docker compose ps -a` first when they are missing.
  worker:
    image: registry.internal.efre-direkt.de/direkt-calltrainer-worker:${TAG:-latest}
    restart: unless-stopped
    # The backend's set: the job imports the same client configuration, which
    # requires every pipeline variable at import. OIDC_ISSUER goes unread here.
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *logging

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--loglevel", "warning"]
    # No volume: the queue holds in-flight jobs only; a job's outcome lives in
    # Postgres (ADR 0032).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *logging

  db:
    image: postgres:17
    restart: unless-stopped
    command: postgres -c log_checkpoints=off
    environment:
      # Fixed, matching DEFAULT_USER/DEFAULT_DATABASE in backend/db/session.py.
      # Applied only when the volume is created.
      POSTGRES_USER: trainer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: trainer
    # No published port; `docker compose exec db psql` still works.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainer -d trainer"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *logging

volumes:
  # The name compose.yaml gives it too, so a server that ran the old
  # build-on-server setup keeps its stored Sessions.
  pgdata:
    name: direkt-calltrainer_pgdata

networks:
  # Created and owned by the external reverse proxy's stack, not this one.
  proxy:
    external: true
    name: ${PROXY_NETWORK:?set PROXY_NETWORK in .env}
