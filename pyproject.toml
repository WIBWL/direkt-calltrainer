# The uv workspace (ADR 0108): shared/, backend/, worker/, one lockfile.
[project]
name = "direkt-calltrainer"
version = "0"
requires-python = "==3.12.*"
dependencies = ["calltrainer-backend", "calltrainer-worker"]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "flake8==7.1.1",
    "flake8-pyproject==1.2.3",
    "pylint==3.3.3",
    # backend/scripts/generate_erd.py
    "pydot==3.0.4",
    "sqlalchemy-schemadisplay==2.0",
    "mkdocs==1.6.1",
    "mkdocs-material==9.5.49",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["shared", "backend", "worker"]

[tool.uv.sources]
calltrainer-backend = { workspace = true }
calltrainer-worker = { workspace = true }


[tool.pytest.ini_options]
testpaths = ["shared/tests", "backend/tests", "worker/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    # starlette imports `multipart` under its old name
    "ignore::PendingDeprecationWarning",
]


# Read through flake8-pyproject.
[tool.flake8]
ignore = ["E261", "W293", "W504", "W291", "E221"]
max-line-length = 120
max-complexity = 10
# Alembic revisions are generated; reviewed by hand, not linted.
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "frontend/node_modules",
    "shared/db/migrations/versions",
]
# For a revision passed explicitly, which `exclude` does not cover.
per-file-ignores = ["shared/db/migrations/versions/*: E12"]


[tool.pylint.main]
py-version = "3.12"
ignore = [".venv", "venv", "dist", ".git"]
# Generated revisions; the prefix matches relative, absolute and Windows paths (re.match).
ignore-paths = ['(^|.*[\\/])migrations[\\/]versions[\\/].*']
# Populated at runtime (alembic) or compiled (parselmouth.praat): no static members.
ignored-modules = ["alembic.context", "alembic.op", "parselmouth.praat"]
# A compiled extension, imported for introspection instead of reporting I1101.
extension-pkg-allow-list = ["parselmouth"]
# Not an init-hook on sys.path, which shadowed stdlib modules from another working directory.
source-roots = ["."]

[tool.pylint."messages control"]
# Style and formatting are flake8's.
disable = [
    "C0301",  # line-too-long   -- flake8 (E501) owns line length
    "C0303",  # trailing-whitespace -- flake8 (W291/W293) owns this
    "C0304",  # missing-final-newline -- flake8 (W292) owns this
    "C0305",  # trailing-newlines -- flake8 (W391) owns this
    "W0311",  # bad-indentation  -- flake8 (E1xx) owns this
    "W0511",  # fixme            -- ignore TODO/FIXME comments
    "W0611",  # unused-import    -- flake8 (F401) owns this
    "W1203",  # logging-fstring-interpolation -- f-strings in logging calls
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring -- names and types say enough
    "R0903",  # too-few-public-methods -- models and dataclasses are declarations
    "W0621",  # redefined-outer-name -- pytest fixtures arrive as parameters
]

[tool.pylint.design]
max-args = 5
max-locals = 15
max-returns = 6
max-statements = 50
max-parents = 7
max-attributes = 10
min-public-methods = 2
max-public-methods = 20

[tool.pylint.similarities]
min-similarity-lines = 4
ignore-comments = true
ignore-docstrings = true
ignore-imports = true

[tool.pylint.reports]
reports = false
