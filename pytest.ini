[pytest]
# Backend test suite. See tests/README.md for the feature -> test traceability matrix.
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
    # starlette 0.35 imports `multipart` under its old name (fastapi[all] pin)
    ignore::PendingDeprecationWarning
