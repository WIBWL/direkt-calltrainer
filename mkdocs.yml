site_name: Calltrainer
site_description: AI-powered phone conversation trainer
docs_dir: docs

# Erzeugt das ER-Diagramm vor jedem Build neu aus backend/db/models.py, damit
# docs/datenmodell.md nicht veraltet. Schlaegt das fehl (kein Graphviz), baut
# die Doku mit dem eingecheckten Diagramm weiter.
hooks:
  - scripts/mkdocs_hooks.py

nav:
  - Home: index.md
  - Initial Requirements: initial_requirements.md
  - Features: features.md
  - Szenario- und Persona-Katalog: scenario-catalogue.md
  - Datenmodell: datenmodell.md
  - Architecture Decisions:
      - ADR 0000 - Record Architecture Decisions: adr/0000-record-architecture-decisions.md
      - ADR 0001 - Separate Scenario and Persona Concepts: adr/0001-separate-scenario-and-persona.md
      - ADR 0002 - Personas as an Extensible Library: adr/0002-persona-library.md
      - ADR 0003 - No Human Trainer, Feedback Fully AI-Generated: adr/0003-feedback-fully-ai-generated.md
      - ADR 0004 - Qualitative Feedback Over Score: adr/0004-qualitative-feedback-over-score.md
      - ADR 0005 - No Automated Enterprise/CRM Integration, No Sales KPIs: adr/0005-no-domain-knowledge-or-sales-kpis.md
      - ADR 0006 - German Only for the MVP (superseded): adr/0006-german-only-for-mvp.md
      - ADR 0007 - Desktop + Headset Primary Access: adr/0007-desktop-headset-primary-access.md
      - ADR 0008 - React + TypeScript Frontend: adr/0008-react-typescript-frontend.md
      - ADR 0009 - Keycloak OIDC Authorization Code Flow + PKCE: adr/0009-keycloak-oidc-pkce-auth.md
      - ADR 0010 - Own PostgreSQL Instance for Session Persistence: adr/0010-own-postgresql-instance-for-session-persistence.md
      - ADR 0011 - DiReKT LLM Backend, Self-Contained: adr/0011-direkt-llm-backend.md
      - ADR 0012 - Python + FastAPI Backend: adr/0012-python-fastapi-backend.md
      - ADR 0013 - Minimal Required Setup, Advanced Options Separate: adr/0013-minimal-required-setup.md
      - ADR 0014 - Feedback Only in the Post-Call Wrap-Up: adr/0014-feedback-only-after-call.md
      - ADR 0015 - Persona Selection via Card View: adr/0015-persona-card-selection.md
      - ADR 0016 - Pipeline Failure Handling (Retry Once, Then End Session): adr/0016-pipeline-failure-handling.md
      - ADR 0017 - No Provider Abstraction Layer: adr/0017-no-provider-abstraction.md
      - ADR 0018 - Layered Monolith + Async Feedback Worker: adr/0018-layered-monolith-with-async-feedback-worker.md
      - ADR 0019 - Redis + RQ Job Queue: adr/0019-redis-rq-job-queue.md
      - ADR 0020 - University-Hosted Server Deployment: adr/0020-university-server-hosting.md
      - ADR 0021 - Local Self-Hosted STT/TTS Models (TTS half superseded): adr/0021-local-stt-tts-models.md
      - ADR 0022 - Language as Independent Session Parameter (superseded): adr/0022-language-independent-session-parameter.md
      - ADR 0023 - No Session Data Persisted Beyond the MVP; Consent-Gated Storage After (superseded): adr/0023-no-persistence-in-mvp-consent-gated-after.md
      - ADR 0024 - User-Authored Scenario Context and Personas (Post-MVP): adr/0024-user-authored-scenario-and-persona.md
      - ADR 0025 - SQLAlchemy 2.0 as ORM: adr/0025-sqlalchemy-orm.md
      - ADR 0026 - Normalized Relational Schema for Session Persistence: adr/0026-normalized-schema-for-session-persistence.md
      - ADR 0027 - Alembic Migrations Autogenerated from ORM Metadata: adr/0027-alembic-migrations-from-orm-metadata.md
      - ADR 0028 - No Secondary Indexes Beyond Primary/Foreign Keys Yet: adr/0028-no-secondary-indexes-yet.md
      - ADR 0029 - JSONB for Flexible Per-Measurement Detail Data: adr/0029-jsonb-for-measurement-details.md
      - ADR 0030 - ER Diagram Generated from ORM Metadata: adr/0030-erd-generated-from-orm-metadata.md
      - ADR 0031 - Pseudonymous subject_id Placeholder Instead of a User FK: adr/0031-pseudonymous-subject-id-placeholder.md
      - ADR 0032 - AnalysisJob as a Persisted Entity for Async Job Status: adr/0032-analysis-job-persisted-status.md
      - ADR 0033 - Streaming Session Pipeline via Chunked TTS over WebSocket: adr/0033-streaming-session-pipeline.md
      - ADR 0034 - Session Data Persisted in the MVP, Written Once at Session End: adr/0034-persist-session-data-at-session-end.md
      - ADR 0035 - Eager Client-Driven Barge-In Interruption: adr/0035-barge-in-interruption.md
      - ADR 0036 - VAD Confirmed-Speech Threshold Instead of a Backchannel Word List: adr/0036-vad-backchannel-filtering.md
      - ADR 0037 - Closing-Intent Detection Is Regex-Based, Not an LLM Classifier: adr/0037-regex-closing-intent-detection.md
      - ADR 0038 - Repetition Guard and Guaranteed Fallback Closing Line: adr/0038-repetition-guard-and-fallback-closing.md
      - ADR 0039 - Centralized Logging, Colored Console + Per-Session-Truncated File: adr/0039-centralized-logging.md
      - ADR 0040 - KugelAudio Default TTS with DiReKT Fallback; Gemini Removed: adr/0040-kugelaudio-default-tts-gemini-removed.md
      - ADR 0041 - Personas and Scenarios Loaded from the Database: adr/0041-personas-scenarios-from-database.md
      - ADR 0042 - Opening Turn Pre-Warmed at Session Commitment: adr/0042-prewarm-opening-turn-at-commitment.md
      - ADR 0043 - English Prompt Content, Session Language Bound to the Persona: adr/0043-english-prompt-content-persona-bound-language.md
      - ADR 0044 - Forward KugelAudio's Audio Sub-Chunks; No Persistent Streaming Session: adr/0044-streaming-tts-forward-subchunks.md
      - ADR 0045 - Case Facts, Call Goal and Success Condition on the Scenario; Objections on the Persona: adr/0045-case-facts-on-scenario-objections-on-persona.md
      - ADR 0046 - Liveliness Is Pursued at the Prompt Layer Before the Turn-Taking Layer (proposed): adr/0046-liveliness-at-the-prompt-layer.md
      - ADR 0047 - Praat via Parselmouth as the Paraverbal Measurement Engine: adr/0047-parselmouth-praat-acoustic-measurement.md
      - ADR 0048 - Paraverbal Analysis Inline on In-Memory Audio, Audio Never Persisted: adr/0048-inline-acoustic-analysis-audio-not-persisted.md
      - ADR 0049 - The Model Interprets Measurements, It Does Not Produce Them: adr/0049-deterministic-measurement-llm-interpretation.md
      - ADR 0050 - A Session Is Addressed by an Unguessable Id: adr/0050-unguessable-session-id.md
      - ADR 0051 - Session-Level Statistics Carrying No Invented Norms: adr/0051-session-level-statistics-and-machine-latency.md
  # arc42 is one long page; the chapter entries below are anchor links into it.
  # MkDocs only accepts site-absolute URLs as nav links, so these assume the docs
  # site is served at the root (mkdocs serve / mkdocs build + static server).
  - Architecture (arc42):
      - Gesamtdokument: arc42.md
      - 1. Einführung und Ziele: /arc42/#1-einfuhrung-und-ziele
      - 2. Randbedingungen: /arc42/#2-randbedingungen
      - 3. Kontextabgrenzung: /arc42/#3-kontextabgrenzung
      - 4. Lösungsstrategie: /arc42/#4-losungsstrategie
      - 5. Bausteinsicht: /arc42/#5-bausteinsicht
      - 6. Laufzeitsicht: /arc42/#6-laufzeitsicht
      - 7. Verteilungssicht: /arc42/#7-verteilungssicht
      - 8. Querschnittliche Konzepte: /arc42/#8-querschnittliche-konzepte
      - 9. Architekturentscheidungen: /arc42/#9-architekturentscheidungen
      - 10. Qualitätsanforderungen: /arc42/#10-qualitatsanforderungen
      - 11. Risiken und technische Schulden: /arc42/#11-risiken-und-technische-schulden
      - 12. Glossar: /arc42/#12-glossar

theme:
  name: material
  language: de
  features:
    - navigation.expand

markdown_extensions:
  - tables
  - toc:
      permalink: true
