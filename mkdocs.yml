site_name: Calltrainer
site_description: AI-powered phone conversation trainer
docs_dir: docs

# Regenerates the ER diagram from backend/db/models.py before every build, so
# that docs/datenmodell.md never goes stale. If that fails (no Graphviz), the
# docs are built with the checked-in diagram instead.
hooks:
  - scripts/mkdocs_hooks.py

