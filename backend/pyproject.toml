# The API and the live call.
[project]
name = "calltrainer-backend"
version = "0"
requires-python = "==3.12.*"
dependencies = [
    "calltrainer-shared",
    # Web / API server
    "fastapi==0.142.1",
    "gunicorn==26.2.0",
    # The gunicorn worker class (backend/gunicorn_worker.py); uvicorn.workers is deprecated
    "uvicorn-worker==0.4.0",
    "pyjwt[crypto]==2.15.1",
    "uvicorn[standard]==0.54.0",
    # UploadFile, the PDF upload in /api/scenarios/document
    "python-multipart==0.0.32",
    # Speech output (ADR 0103)
    "kugelaudio==1.9.0",
    # Scenario authoring: pull text out of an uploaded PDF (text-layer only, no OCR)
    "pypdf==6.19.0",
]

[tool.uv]
package = false

[tool.uv.sources]
calltrainer-shared = { workspace = true }
